[package]
name = "pgflightd"
version.workspace = true
edition.workspace = true
license = "MIT"

[dependencies]
pg-proxy = { path = "../../crates/pg-proxy" }
pg-analyzer = { path = "../../crates/pg-analyzer" }
pg-storage = { path = "../../crates/pg-storage" }
pgflight-control = { path = "../../crates/pgflight-control" }
pg-shadow = { path = "../../crates/pg-shadow" }
pg-wire = { path = "../../crates/pg-wire" }
hdrhistogram = { workspace = true }
tokio-postgres = { workspace = true }
bytes = { workspace = true }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }