stages:
  - lint
  - test
  - integration

variables:
  CARGO_TERM_COLOR: always

.rust:
  image: rust:1.83
  before_script:
    - rustup component add rustfmt clippy

lint:
  extends: .rust
  stage: lint
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings

unit:
  extends: .rust
  stage: test
  script:
    - cargo test --workspace

integration:
  extends: .rust
  stage: integration
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - apt-get update && apt-get install -y docker-compose-plugin python3-pip
    - pip3 install 'psycopg[binary]'
    - docker compose -f docker/docker-compose.yml up -d --wait
    - cargo test -p pg-proxy -- --ignored
    - cargo test -p pgflightd -- --ignored